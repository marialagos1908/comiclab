<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicLab - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-xl font-black tracking-wider text-indigo-900">COMICLAB</span>
            <nav class="hidden md:flex items-center space-x-6 font-medium">
                <a href="index.html" class="text-gray-600 hover:text-indigo-600">Inicio</a>
                <a href="categorias.html" class="text-gray-600 hover:text-indigo-600">Categorías</a>
                <a href="fondos.html" class="text-gray-600 hover:text-indigo-600">Fondos</a>
                <a href="personajes.html" class="text-gray-600 hover:text-indigo-600">Diseños de personaje</a>
            </nav>
            <a href="registro.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium">Contáctanos</a>
        </div>
    </header>

    <main class="container mx-auto px-6 py-16 max-w-lg bg-white mt-12 rounded-xl shadow-md border">
        <h1 class="text-3xl font-extrabold text-center mb-8 text-gray-900">Registro</h1>
        
        <form onsubmit="event.preventDefault(); alert('¡Ingreso registrado con éxito!');" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre *</label>
                <input type="text" required class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Usuario</label>
                <input type="text" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Correo Electronico *</label>
                <input type="email" required class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
                <input type="password" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="text-right">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-lg transition">Ingresar</button>
            </div>
        </form>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-indigo-600 text-sm hover:underline">← Volver al inicio</a>
        </div>
    </main>
</body>
</html>
